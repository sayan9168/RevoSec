[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revosec"
version = "1.2.0"
description = "Revolutionary Ethical Cybersecurity Toolkit - Production-grade network analysis, encryption, system audit, password tools & more. For authorized use only."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sayan the researcher", email = "sm6881164@gmail.com"}
]
keywords = ["cybersecurity", "ethical-hacking", "network-security", "encryption", "security-audit", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "scapy>=2.5.0",
    "python-nmap>=0.7.1",
    "watchdog>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "tabulate>=0.9.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
revosec = "revosec.cli:app"

[project.urls]
Homepage = "https://github.com/sayan9168/RevoSec"
Repository = "https://github.com/sayan9168/RevoSec"
Issues = "https://github.com/sayan9168/RevoSec/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
